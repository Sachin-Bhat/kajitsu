# Replace the existing gpui-shell exec-once line with this at cutover.
# Install target/release/kajitsu in PATH first, or use its absolute path.
exec-once=env KAJITSU_CONFIG_DIR=/home/sachin/Documents/kajitsu kajitsu

# Replace the existing fuzzel launcher binding.
bind=ALT,Space,spawn,kajitsu ipc call launcher toggle
bind=ALT+SHIFT,w,spawn,kajitsu ipc call wallpaper toggle
bind=ALT+SHIFT,p,spawn,kajitsu ipc call launcher showTmux
bind=ALT+SHIFT,c,spawn,kajitsu ipc call control toggle
bind=ALT+SHIFT,u,spawn,kajitsu ipc call utility toggle

# Keep the existing daily lock route until Kajitsu lock/unlock is validated.
bind=ALT,l,spawn,rustlock --screenshots --clock --indicator --effect-blur 7x5 --effect-vignette 0.5:0.5
